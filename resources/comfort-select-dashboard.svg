<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Twilight Indigo to Violet (IU Lilac & Palette Theme) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Accent Gradient: Neon Lilac to Cyan Glow -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Lime Yellow Glow Gradient (IU Lightstick/Dandelion Color) -->
    <linearGradient id="lightstick-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Glassmorphic Highlights -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Ambient Purple/Violet Glow -->
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#090514" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Squircle Base Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" stroke="#4c1d95" stroke-width="8" filter="url(#shadow)" />

  <!-- 2. Subtle Glassmorphic Highlight (Diagonal) -->
  <path d="M 32,144 C 32,80 80,32 144,32 L 368,32 C 432,32 480,80 480,144 L 480,220 L 32,360 Z" fill="url(#glass-grad)" />

  <!-- 3. Smart Scale Top Glass Platform Accent -->
  <path d="M 64,100 L 448,100 A 32,32 0 0,0 416,68 L 96,68 A 32,32 0 0,0 64,100 Z" fill="#2e1065" opacity="0.6" />
  <line x1="64" y1="100" x2="448" y2="100" stroke="#6b21a8" stroke-width="2" opacity="0.6" />

  <!-- 4. Radial Glow in the Telemetry Circle -->
  <circle cx="256" cy="256" r="140" fill="url(#inner-glow)" />

  <!-- 5. Outer Telemetry Dial (Dashed track) -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2e1065" stroke-width="8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-dasharray="754" stroke-dashoffset="240" stroke-linecap="round" filter="url(#glow)" />

  <!-- 6. Metal Contact Sensors (Scale Electrodes - Sparkling Stars) -->
  <!-- Upper Left Electrode -->
  <rect x="140" y="140" width="40" height="40" rx="20" fill="#4c1d95" opacity="0.4" />
  <circle cx="160" cy="160" r="10" fill="url(#lightstick-grad)" filter="url(#glow)" />
  <!-- Upper Right Electrode -->
  <rect x="332" y="140" width="40" height="40" rx="20" fill="#4c1d95" opacity="0.4" />
  <circle cx="352" cy="160" r="10" fill="url(#lightstick-grad)" filter="url(#glow)" />
  <!-- Lower Left Electrode -->
  <rect x="140" y="332" width="40" height="40" rx="20" fill="#4c1d95" opacity="0.4" />
  <circle cx="160" cy="352" r="10" fill="#c084fc" filter="url(#glow)" />
  <!-- Lower Right Electrode -->
  <rect x="332" y="332" width="40" height="40" rx="20" fill="#4c1d95" opacity="0.4" />
  <circle cx="352" cy="352" r="10" fill="#c084fc" filter="url(#glow)" />

  <!-- 7. Display Screen (Digital Panel representing smart scale feedback - displaying "I U") -->
  <rect x="196" y="106" width="120" height="38" rx="8" fill="#090514" stroke="#581c87" stroke-width="2" />
  <text x="256" y="132" font-family="'Outfit', 'Inter', monospace" font-size="24" font-weight="900" fill="url(#lightstick-grad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">80.0</text>

  <!-- 8. Pulse Telemetry Wave (ECG Heartbeat with a central Heart loop shape) -->
  <!-- Shadow/Glow Background Wave -->
  <path d="M 136,256 L 190,256 C 200,256 205,240 210,220 C 215,200 222,170 230,170 C 238,170 242,190 248,210 C 253,190 257,170 265,170 C 273,170 280,200 285,220 C 290,240 295,256 305,256 L 376,256" fill="none" stroke="#a855f7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#glow)" />
  
  <!-- Stylized Telemetry Heart Outline Loop in Center -->
  <!-- Left Side of Heart -->
  <path d="M 256,280 C 210,210 205,175 235,160 C 250,152 256,170 256,170" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Right Side of Heart -->
  <path d="M 256,280 C 302,210 307,175 277,160 C 262,152 256,170 256,170" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Horizontal Pulse Wave Overlay -->
  <path d="M 136,256 L 196,256 L 210,230 L 225,290 L 240,210 L 256,270 L 272,210 L 287,290 L 302,230 L 316,256 L 376,256" fill="none" stroke="url(#lightstick-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 9. Soft Glittering Stars (Fandom/Love Poem theme) -->
  <!-- Top Left Sparkle -->
  <path d="M 100,200 L 104,204 L 100,208 L 96,204 Z" fill="#bef264" filter="url(#glow)" />
  <!-- Bottom Right Sparkle -->
  <path d="M 400,300 L 404,304 L 400,308 L 396,304 Z" fill="#bef264" filter="url(#glow)" />
  <!-- Small Branding Base Accent -->
  <path d="M 236,410 H 276" stroke="#581c87" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
