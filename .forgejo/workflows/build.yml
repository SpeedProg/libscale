name: C++ Build Pipeline

# Trigger the build on pushes and pull requests to the main/master branches
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    name: Build for Linux
    # Use the label we configured to target your runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your source code using the exact repository URL
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install system-level C++ and UI dependencies
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip cmake ninja-build libusb-1.0-0-dev libgtkmm-4.0-dev pkg-config libudev-dev

      # Step 3: Set up the Conan package manager
      - name: Install Conan
        run: |
          pip3 install conan --break-system-packages
          conan profile detect --force

      # Step 4: Create the libscale package the dashboard depends on.
      # After libscale moves to its own repository, check it out first (submodule or clone), e.g.:
      #   git clone --depth 1 --branch libscale-v1.0.0 https://github.com/SpeedProg/libscale.git libscale
      - name: Create libscale Package
        run: |
          conan create libscale --build=missing -s build_type=Release

      # Step 5: Compile the project
      - name: Build Project
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

      # Step 6: Verify the build with the test suite
      - name: Run Tests
        working-directory: build/Release
        run: ctest --output-on-failure

      # Step 7: Package the compiled binary and UI assets
      - name: Prepare Artifacts
        run: |
          mkdir -p dist/bin dist/share/de.speedprog.comfort-select-dashboard
          cp build/Release/src/gui/comfort_select_dashboard dist/bin/
          cp ui/main_window.ui src/gui/style.css dist/share/de.speedprog.comfort-select-dashboard/

      # Step 8: Upload the packaged files so you can download them from the UI
      - name: Upload Linux Binary
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: comfort-select-dashboard-linux
          path: dist/
