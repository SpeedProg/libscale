name: C++ Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libgtkmm-4.0-dev pkg-config libudev-dev
    - name: Install Conan
      run: pip install conan
    - name: Conan Profile
      run: conan profile detect --force
    - name: Build
      run: |
        conan install . --build=missing -s build_type=Release
        cmake --preset conan-release
        cmake --build --preset conan-release
        mkdir -p dist/bin dist/share/de.speedprog.comfort-select-dashboard
        cp build/Release/src/gui/comfort_select_dashboard dist/bin/
        cp ui/main_window.ui src/gui/style.css dist/share/de.speedprog.comfort-select-dashboard/
    - name: Run Tests
      working-directory: build/Release
      run: ctest --output-on-failure
    - name: Upload Linux Binary
      uses: actions/upload-artifact@v7
      with:
        name: comfort-select-dashboard-linux
        path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Conan on Host
      run: pip install conan

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        path-type: inherit
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-gtkmm-4.0
          mingw-w64-ucrt-x86_64-libusb

    - name: Conan Profile
      shell: msys2 {0}
      run: |
        CONAN_HOME=$(conan config home)
        mkdir -p "$CONAN_HOME/profiles"
        cat << 'EOF' > "$CONAN_HOME/profiles/default"
        [settings]
        os=Windows
        arch=x86_64
        compiler=gcc
        compiler.version=15.2
        compiler.libcxx=libstdc++11
        compiler.cppstd=gnu20
        build_type=Release

        [conf]
        tools.cmake.cmaketoolchain:generator=Ninja
        EOF

    - name: Install Conan Dependencies
      shell: msys2 {0}
      run: |
        conan install . --build=missing -s build_type=Release

    - name: Build Dashboard
      shell: msys2 {0}
      run: |
        cmake --preset conan-release
        cmake --build --preset conan-release
        mkdir -p dist-win/resources
        cp build/Release/src/gui/comfort_select_dashboard.exe dist-win/
        cp ui/main_window.ui src/gui/style.css dist-win/resources/
    - name: Upload Windows Binary
      uses: actions/upload-artifact@v7
      with:
        name: comfort-select-dashboard-windows
        path: dist-win/
