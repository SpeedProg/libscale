id: de.speedprog.comfort-select-dashboard
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: comfort_select_dashboard

finish-args:
  # UI rendering permissions
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  
  # Crucial for libusb communication with the physical scale device
  - --device=all

modules:
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.26/libusb-1.0.26.tar.bz2
        sha256: 12ce7a61fc9854d1d2a1ffe095f7b5fac19ddba095c259e6067a46500381b5a5

  - name: fmt
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/fmtlib/fmt/releases/download/10.2.1/fmt-10.2.1.zip
        sha256: 312151a2d13c8327f5c9c586ac6cf7cddc1658e8f53edae0ec56509c8fa516c9

  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DSPDLOG_FMT_EXTERNAL=ON
    sources:
      - type: archive
        url: https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz
        sha256: 4dccf2d10f410c1e2feaff89966bfc49a1abb29ef6f08246335b110e001e09a9

  - name: nlohmann_json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.11.2.tar.gz
        sha256: d69f9deb6a75e2580465c6c4c5111b89c4dc2fa94e3a85fcd2ffcd9a143d9273

  - name: sqlite_orm
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/fnc12/sqlite_orm/archive/refs/tags/v1.8.2.tar.gz
        sha256: 56e0c7729800637a8061658d0fdad4424d2cdde77b063d23cc1b76aa20339072

  - name: gtest
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_GTEST=ON
      - -Dgtest_force_shared_crt=ON
    sources:
      - type: archive
        url: https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz
        sha256: 8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7

  - name: libsigcplusplus
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.4/libsigc++-3.4.0.tar.xz
        sha256: 02e2630ffb5ce93cd52c38423521dfe7063328863a6e96d41d765a6116b8707e

  - name: glibmm
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.80/glibmm-2.80.0.tar.xz
        sha256: 539b0a29e15a96676c4f0594541250566c5ca44da5d4d87a3732fa2d07909e4a

  - name: cairomm
    buildsystem: meson
    config-opts:
      - -Dbuild-tests=false
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://tarballs.nixos.org/sha256/b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        dest-filename: cairomm-1.18.0.tar.xz

  - name: pangomm
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.54/pangomm-2.54.0.tar.xz
        sha256: 4a5b1fd1b7c47a1af45277ea82b5abeaca8e08fb10a27daa6394cf88d74e7acf

  - name: gtkmm
    buildsystem: meson
    config-opts:
      - -Dbuild-demos=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.20/gtkmm-4.20.0.tar.xz
        sha256: daad9bf9b70f90975f91781fc7a656c923a91374261f576c883cd3aebd59c833

  # libscale lives in its own subproject; once it is split into a separate
  # repository this becomes a git source pinned to a release tag, e.g.
  #   - type: git
  #     url: https://github.com/speedprog/libscale.git
  #     tag: libscale-v1.0.0
  - name: libscale
    buildsystem: cmake-ninja
    config-opts:
      - -DLIBSCALE_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: libscale

  - name: comfort-select-dashboard
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
